[workspace]
name = "ANTIPOMPEII"
version = "0.1.1"
description = "A Nested Tool for Integrated Planning of Multi-hazard Preparedness and Emergency Infrastructure Intervention"
authors = ["Pavel Kiparisov <pavel@kiparisov.space>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
start = "python -m src.antipompeii.main"
clean = "rm -rf .pixi __pycache__ **/__pycache__ **/*.pyc"

[dependencies]
python = "3.13.*"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scipy = ">=1.10.0"
scikit-learn = ">=1.3.0"
networkx = ">=3.0"
osmnx = ">=1.6.0"
matplotlib = ">=3.7.0"
pyyaml = ">=6.0"
geopandas = ">=0.13.0"
rasterio = ">=1.3.0"
requests = ">=2.28.0"
shapely = ">=2.0.0"
graph-tool = ">=2.98,<3"

[pypi-dependencies]
litellm = ">=1.0.0"
